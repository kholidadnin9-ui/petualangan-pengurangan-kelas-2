<style>
  @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap");

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    background: #87ceeb;
    color: #3a2512;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  img { max-width: 100%; display: block; }

  /* ============================
     LAYOUT UTILITIES
  ============================ */
  .screen {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }
  .row { display: flex; align-items: center; }
  .row-between { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .col { display: flex; flex-direction: column; }
  .center { display: flex; align-items: center; justify-content: center; }
  .gap-1 { gap: 6px; }
  .gap-2 { gap: 10px; }
  .gap-3 { gap: 16px; }
  .w-full { width: 100%; }
  .text-center { text-align: center; }
  .mt-1 { margin-top: 8px; }
  .mt-2 { margin-top: 14px; }
  .mt-3 { margin-top: 20px; }
  .mt-4 { margin-top: 28px; }
  .hidden { display: none !important; }

  /* ============================
     JUNGLE BACKGROUND
  ============================ */
  .jungle-scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 45% at 50% 100%, rgba(22,101,52,0.5), transparent 70%),
      linear-gradient(180deg, #7dd3fc 0%, #bae6fd 35%, #fef3c7 55%, #86efac 80%, #22c55e 100%);
  }
  .jungle-scene::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%, rgba(0,60,20,0.25) 100%);
  }
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.85);
    border-radius: 999px;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud.c1 { top: 6%; left: -10%; width: 140px; height: 40px; animation: drift 55s linear infinite; }
  .cloud.c1::before { width: 70px; height: 70px; top: -30px; left: 20px; }
  .cloud.c1::after  { width: 50px; height: 50px; top: -22px; left: 70px; }
  .cloud.c2 { top: 14%; left: -20%; width: 110px; height: 32px; animation: drift 70s linear infinite; animation-delay: -20s; }
  .cloud.c2::before { width: 56px; height: 56px; top: -24px; left: 16px; }
  .cloud.c2::after  { width: 42px; height: 42px; top: -18px; left: 56px; }
  .cloud.c3 { top: 3%; right: -10%; width: 160px; height: 44px; animation: drift-r 80s linear infinite; }
  .cloud.c3::before { width: 74px; height: 74px; top: -32px; left: 22px; }
  .cloud.c3::after  { width: 54px; height: 54px; top: -26px; left: 80px; }

  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(130vw); } }
  @keyframes drift-r { from { transform: translateX(0); } to { transform: translateX(-130vw); } }

  /* ============================
     ANIMATIONS
  ============================ */
  @keyframes gentle-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .bob { animation: gentle-bob 3.5s ease-in-out infinite; }
  .bob-slow { animation: gentle-bob 4.5s ease-in-out infinite; }

  @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fade-up 0.45s ease both; }

  @keyframes pop-bounce { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 70% { transform: scale(0.96); } 100% { transform: scale(1); } }
  @keyframes wiggle {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(7px); }
  }
  @keyframes star-pop {
    0% { transform: scale(0) rotate(-40deg); opacity: 0; }
    70% { transform: scale(1.3) rotate(10deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ============================
     WOODEN SIGN / TITLES
  ============================ */
  .wood-sign {
    position: relative;
    display: inline-block;
    padding: 12px 36px;
    background: linear-gradient(180deg, #b97b3a 0%, #8b4a1f 50%, #6b3615 100%);
    border-radius: 22px;
    color: #fff;
    font-weight: 900;
    text-align: center;
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,0.25),
      inset 0 -6px 0 rgba(0,0,0,0.25),
      0 8px 0 rgba(0,0,0,0.25),
      0 14px 24px rgba(0,0,0,0.25);
    letter-spacing: 0.5px;
    font-size: clamp(1.5rem, 5vw, 2.25rem);
  }

  .wood-plank {
    position: relative;
    padding: 10px 24px;
    background: linear-gradient(180deg, #c68642 0%, #9a5a25 55%, #6b3615 100%);
    border-radius: 14px;
    color: white;
    font-weight: 900;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.3),
      inset 0 -4px 0 rgba(0,0,0,0.25),
      0 5px 0 rgba(0,0,0,0.2),
      0 10px 20px rgba(0,0,0,0.2);
  }

  .wood-nail {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f3f4f6 0%, #9ca3af 40%, #4b5563 100%);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,0.4);
  }
  .wood-nail.tl { top: 6px; left: 10px; }
  .wood-nail.tr { top: 6px; right: 10px; }
  .wood-nail.bl { bottom: 6px; left: 10px; }
  .wood-nail.br { bottom: 6px; right: 10px; }

  .title-board {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px;
    border-radius: 26px;
    text-align: center;
    background: linear-gradient(180deg, #d4934f 0%, #a66328 45%, #6b3615 100%);
    border: 3px solid #451a03;
    box-shadow:
      inset 0 4px 0 rgba(255,255,255,0.35),
      inset 0 -8px 0 rgba(0,0,0,0.3),
      0 12px 0 rgba(0,0,0,0.25),
      0 22px 40px rgba(0,0,0,0.3);
  }

  .home-title {
    font-size: clamp(2rem, 7vw, 3.1rem);
    line-height: 1;
    margin: 0;
    color: #fde68a;
    text-shadow:
      -2px -2px 0 #7c2d12, 2px -2px 0 #7c2d12, -2px 2px 0 #7c2d12, 2px 2px 0 #7c2d12,
      0 6px 0 #451a03, 0 10px 20px rgba(0,0,0,0.3);
    letter-spacing: 1px;
  }
  .home-title .top {
    display: block;
    font-size: 0.5em;
    color: #fff;
    text-shadow:
      -2px -2px 0 #15803d, 2px -2px 0 #15803d, -2px 2px 0 #15803d, 2px 2px 0 #15803d,
      0 4px 0 #14532d, 0 8px 16px rgba(0,0,0,0.3);
    margin-bottom: 4px;
  }

  .created-by-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 8px auto 0;
    padding: 3px 14px;
    border-radius: 999px;
    background: rgba(69, 26, 3, 0.5);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }
  .created-by-badge span {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: #fde68a;
  }
  .created-by-badge b { color: #fff; text-decoration: underline; text-decoration-color: #fcd34d; }

  /* ============================
     3D GAME BUTTONS
  ============================ */
  .game-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-weight: 900;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
    transition: transform 0.1s ease, filter 0.1s ease;
    letter-spacing: 0.5px;
    padding: 14px 28px;
    font-size: 1.3rem;
    width: 100%;
    max-width: 420px;
  }
  .game-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .game-btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-2px); }
  .game-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none !important; }
  .game-btn.small { font-size: 1.05rem; padding: 10px 20px; }

  .btn-yellow {
    background: linear-gradient(180deg, #fde68a 0%, #fbbf24 45%, #d97706 100%);
    color: #7c2d12;
    text-shadow: 0 2px 0 rgba(255,255,255,0.4);
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.6), inset 0 -6px 0 rgba(120,53,15,0.5), 0 8px 0 #92400e, 0 14px 22px rgba(0,0,0,0.25);
  }
  .btn-green {
    background: linear-gradient(180deg, #86efac 0%, #22c55e 45%, #15803d 100%);
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.5), inset 0 -6px 0 rgba(20,83,45,0.6), 0 8px 0 #14532d, 0 14px 22px rgba(0,0,0,0.25);
  }
  .btn-blue {
    background: linear-gradient(180deg, #7dd3fc 0%, #0ea5e9 45%, #075985 100%);
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.55), inset 0 -6px 0 rgba(7,89,133,0.6), 0 8px 0 #0c4a6e, 0 14px 22px rgba(0,0,0,0.25);
  }
  .btn-orange {
    background: linear-gradient(180deg, #fdba74 0%, #f97316 45%, #9a3412 100%);
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.5), inset 0 -6px 0 rgba(124,45,18,0.6), 0 8px 0 #7c2d12, 0 14px 22px rgba(0,0,0,0.25);
  }

  .circle-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 1.3rem;
    font-weight: 900;
    color: #fff;
    border: none;
    cursor: pointer;
    background: linear-gradient(180deg, #fed7aa 0%, #f97316 50%, #9a3412 100%);
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.55), inset 0 -5px 0 rgba(124,45,18,0.6), 0 6px 0 #7c2d12, 0 10px 18px rgba(0,0,0,0.25);
    transition: transform 0.1s ease;
    flex-shrink: 0;
  }
  .circle-btn:active { transform: translateY(3px); box-shadow: none; }

  /* ============================
     NAME INPUT
  ============================ */
  .name-input-wrap {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }
  .name-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 16px;
    border: 3px solid #92400e;
    font-size: 1.05rem;
    font-weight: 800;
    color: #7c2d12;
    text-align: center;
    background: linear-gradient(180deg, #fff, #fef3c7);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
  }
  .name-input::placeholder { color: #b45309; opacity: 0.6; }

  /* ============================
     INFO PLANKS
  ============================ */
  .info-plank {
    position: relative;
    width: 100%;
    max-width: 340px;
    margin: 0 auto;
    padding: 9px 18px 9px 48px;
    border-radius: 16px;
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    background: linear-gradient(180deg, #c68642 0%, #9a5a25 50%, #6b3615 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -4px 0 rgba(0,0,0,0.25), 0 5px 0 rgba(0,0,0,0.2), 0 10px 18px rgba(0,0,0,0.2);
  }
  .info-plank .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 1.4rem; }

  /* ============================
     CHARACTERS (emoji based)
  ============================ */
  .characters-row {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 130px;
  }
  .char-explorer { font-size: 92px; filter: drop-shadow(0 14px 14px rgba(0,0,0,0.25)); }
  .char-monkey { font-size: 52px; margin-left: -18px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2)); }

  /* ============================
     PARCHMENT / QUESTION BOARD
  ============================ */
  .parchment {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.7), transparent 50%),
      linear-gradient(180deg, #fef3c7 0%, #fde68a 60%, #fcd34d 100%);
    border: 6px solid #92400e;
    border-radius: 28px;
    padding: 30px 22px;
    text-align: center;
    box-shadow:
      inset 0 0 0 4px #fbbf24,
      inset 0 0 40px rgba(146,64,14,0.2),
      0 12px 0 #6b3615,
      0 20px 40px rgba(0,0,0,0.25);
  }
  .parchment::before, .parchment::after {
    content: "";
    position: absolute;
    width: 22px; height: 22px;
    background: radial-gradient(circle at 30% 30%, #fde68a, #92400e 70%);
    border-radius: 50%;
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4);
  }
  .parchment::before { top: 14px; left: 14px; }
  .parchment::after  { top: 14px; right: 14px; }

  .question-label {
    margin: 0;
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #92400e;
  }

  .equation-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 22px 0;
  }
  .equation-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 84px;
    height: 92px;
    padding: 0 8px;
    font-size: 3rem;
    font-weight: 900;
    color: #7c2d12;
    background: linear-gradient(180deg, #fff 0%, #fef3c7 100%);
    border: 4px solid #b45309;
    border-radius: 18px;
    box-shadow: inset 0 -6px 0 rgba(180,83,9,0.25), 0 6px 0 #7c2d12, 0 10px 16px rgba(0,0,0,0.15);
  }
  .equation-num.answer-slot { border-style: dashed; }
  .equation-op { font-size: 2.6rem; font-weight: 900; color: #b91c1c; text-shadow: 0 3px 0 rgba(255,255,255,0.5); }

  .dots-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; max-width: 420px; margin: 0 auto; }
  .dot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid;
    font-size: 9px; font-weight: 900;
  }
  .dot.full { border-color: #15803d; background: #4ade80; color: transparent; }
  .dot.crossed { border-color: #9f1239; background: #fb7185; opacity: 0.7; color: #7f1d1d; }

  .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 26px; }

  .answer-block {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 900;
    color: #fff;
    min-height: 84px;
    border-radius: 22px;
    border: 5px solid rgba(0,0,0,0.25);
    cursor: pointer;
    text-shadow: 0 3px 0 rgba(0,0,0,0.3);
    transition: transform 0.1s ease, filter 0.1s ease;
    box-shadow: inset 0 5px 0 rgba(255,255,255,0.45), inset 0 -8px 0 rgba(0,0,0,0.25), 0 8px 0 rgba(0,0,0,0.2), 0 12px 20px rgba(0,0,0,0.18);
  }
  .answer-block:hover:not(:disabled) { transform: translateY(-3px); filter: brightness(1.06); }
  .answer-block:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .answer-block:disabled { cursor: not-allowed; }
  .answer-block.correct { background: linear-gradient(180deg, #86efac 0%, #22c55e 60%, #14532d 100%) !important; border-color: #14532d !important; animation: pop-bounce 0.5s ease; }
  .answer-block.wrong { background: linear-gradient(180deg, #fda4af 0%, #f43f5e 60%, #881337 100%) !important; border-color: #881337 !important; animation: wiggle 0.45s ease; }
  .answer-block.dimmed { opacity: 0.4; }
  .opt-green  { background: linear-gradient(180deg, #86efac, #22c55e 60%, #15803d); }
  .opt-blue   { background: linear-gradient(180deg, #7dd3fc, #0ea5e9 60%, #0369a1); }
  .opt-orange { background: linear-gradient(180deg, #fdba74, #f97316 60%, #c2410c); }
  .opt-purple { background: linear-gradient(180deg, #d8b4fe, #a855f7 60%, #7e22ce); }

  /* ============================
     LEVEL ISLANDS
  ============================ */
  .level-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 42px 20px;
    width: 100%;
    max-width: 620px;
    margin-top: 30px;
    place-items: center;
  }
  .island {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 170px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    transition: transform 0.15s ease;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.25));
  }
  .island:hover { transform: translateY(-6px) scale(1.03); }
  .island.locked { filter: grayscale(0.6) brightness(0.8); cursor: not-allowed; }
  .island.locked:hover { transform: none; }
  .island-emoji-top { font-size: 2.2rem; margin-bottom: -6px; }
  .island-badge {
    position: relative;
    width: 54px; height: 54px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fef3c7, #b45309 70%, #78350f);
    border: 4px solid #fde68a;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 900; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
    box-shadow: 0 5px 0 #78350f, 0 10px 16px rgba(0,0,0,0.25);
    margin-bottom: -14px; z-index: 2;
  }
  .island-top {
    position: relative;
    width: 150px; height: 76px;
    border-radius: 50% 50% 18px 18px / 60% 60% 18px 18px;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,0.15), inset 0 6px 0 rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.4rem;
  }
  .island-dirt {
    width: 160px; height: 40px; margin-top: -12px;
    background: linear-gradient(180deg, #92400e 0%, #78350f 60%, #451a03 100%);
    border-radius: 0 0 60% 60% / 0 0 40px 40px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.3), inset 0 4px 0 rgba(255,255,255,0.1);
  }
  .island-name {
    margin: -20px auto 0; width: 148px; padding: 5px 8px; border-radius: 12px;
    text-align: center; font-weight: 900; color: #fff; font-size: 0.85rem;
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  .island-stars { margin-top: 5px; display: flex; gap: 3px; font-size: 0.9rem; }
  .island-stars .off { opacity: 0.3; filter: grayscale(1); }

  /* ============================
     STAR RATING & MINI STARS
  ============================ */
  .mini-stars {
    display: inline-flex; align-items: center; gap: 4px;
    background: linear-gradient(180deg, #fef3c7, #fde68a);
    border: 3px solid #92400e; border-radius: 999px; padding: 6px 14px;
    font-weight: 900; color: #7c2d12; box-shadow: 0 4px 0 #7c2d12;
    white-space: nowrap;
  }

  .big-star {
    display: inline-block;
    font-size: 2.6rem;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.2));
    animation: star-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .big-star.dim { filter: grayscale(1) opacity(0.35); }

  /* ============================
     SPEECH BUBBLE
  ============================ */
  .speech-bubble {
    position: relative;
    background: #fff;
    border: 4px solid #92400e;
    border-radius: 22px;
    padding: 10px 16px;
    font-weight: 800;
    color: #3a2512;
    font-size: 0.95rem;
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    max-width: 220px;
  }
  .speech-bubble::after {
    content: ""; position: absolute; bottom: -16px; left: 24px;
    width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
    border-top: 16px solid #92400e;
  }
  .speech-bubble::before {
    content: ""; position: absolute; bottom: -10px; left: 28px;
    width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-top: 10px solid #fff; z-index: 1;
  }

  /* ============================
     PROGRESS DOTS
  ============================ */
  .progress-dots { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; }
  .progress-dots .pd { height: 12px; border-radius: 999px; width: 12px; background: rgba(255,255,255,0.7); box-shadow: 0 2px 0 rgba(0,0,0,0.15); transition: all 0.2s ease; }
  .progress-dots .pd.done-correct { width: 20px; background: #4ade80; }
  .progress-dots .pd.done-wrong { width: 20px; background: #fb7185; }
  .progress-dots .pd.current { width: 32px; background: #fbbf24; box-shadow: 0 0 0 3px rgba(180,83,9,0.4); }
